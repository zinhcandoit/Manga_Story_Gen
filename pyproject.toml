[project]
name = "manga-story-gen"
version = "0.1.0"
description = "Manga GRPO Training Environment"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
    "unsloth[colab-new]",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.11.0",
    "transformers",
    "trl==0.24.0",
    "peft==0.19.1",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "datasets==4.3.0",
    "xformers",
    "pillow==12.1.1",
    "python-dotenv",
    "sentence-transformers==5.4.1",
    "google-genai",
    "ipywidgets",
    "matplotlib==3.10.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
unsloth = { git = "https://github.com/unslothai/unsloth.git" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true